name: Build TWRP Sony Tama

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename (akari / apollo / aurora / akatsuki)'
        required: true
        default: 'akari'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip \
            curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip repo python-is-python3

      - name: Set up build directory permissions
        run: sudo chown -R $USER:$USER /home/runner

      - name: Initialize repo
        run: |
          mkdir ~/twrp && cd ~/twrp
          git config --global user.name "github-actions"
          git config --global user.email "ci@users.noreply.github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1

      - name: Sync sources
        working-directory: ~/twrp
        run: repo sync -j$(nproc --all) -c --no-clone-bundle --no-tags

      - name: Clone device tree
        working-directory: ~/twrp
        run: |
          git clone https://github.com/aoi-itsme/recovery_device_sony_tama.git -b android-14.1 device/sony/tama

      - name: Build
        working-directory: ~/twrp
        run: |
          unset JAVAC JAVA_HOME LEX
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CUSTOM_VERSION=true
          . build/envsetup.sh
          lunch twrp_${{ github.event.inputs.device }}-ap2a-userdebug
          mka bootimage

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.device }}
          path: ~/twrp/out/target/product/${{ github.event.inputs.device }}/boot.img
